appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S%.3f %:z)} {h({l:<5})} [{T}] {t} — {m}{n}"
  app_file:
    kind: rolling_file
    path: logs/application.log
    append: true
    encoder:
      kind: json
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 20 mb
      roller:
        kind: fixed_window
        pattern: "logs/app.{}.log"
        count: 5
        base: 1

root:
  level: info
  appenders:
    - stdout
    - app_file

loggers:
  sqlx:
    level: warn