# [package]
# name = "tempa"
# version = "0.1.0"
# edition = "2024"

[workspace]
members = [
    "apps/backend", "crates/domain", "crates/shared",
    # "crates/domain/*",
    # "crates/application/*",
    # "crates/infrastructure/*",
    # "cretes/agent-protocol",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-test = "21.0.0"
dotenvy = "0.15.7"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
log = {version = "0.4.33", features = ["kv", "kv_serde", "serde"]}
log4rs = { version = "1.4.0", features = ["log_kv", "json_encoder"]}
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
validator = { version = "0.21", features = ["derive"] }
thiserror = "2.0.20"
domain = { path = "crates/domain" }